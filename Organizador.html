<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="La Esquinita - Organizador de tareas universitarias con filtros, búsqueda y calendario." />
    <link rel="stylesheet" href="styles.css">
    <title>La Esquinita | Organizador</title>
</head>
<body>
    <header>
      <div class="container">

        <div class="brand-header">
            <img src="asset/images/logo 2.0.png" alt="Logo La Esquinita" class="logo-img">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="tareas.html">Tareas</a></li>
                <li><a href="Organizador.html">Organizador</a></li>
                <li><a href="acerca.html">Acerca de</a></li>
            </ul>
        </nav>

    </div>
    </header>

    <main>
        <div class="container">
        <section>
            <h1>Organizador de tareas</h1>
            <p>Gestiona tus entregas con opciones claras para agregar, quitar y planificar tus próximas asignaciones.</p>
        </section>

         <section>
            <h2>Agregar nueva tarea</h2>
            <form id="task-form" class="form-grid">
                <div class="field-group">
                    <label for="task-title">Título de la tarea</label>
                    <input id="task-title" type="text" placeholder="Título de la tarea" required>
                </div>
                <div class="field-group">
                    <label for="task-course">Curso</label>
                    <input id="task-course" type="text" placeholder="Nombre del curso" required>
                </div>
                <div class="field-group">
                    <label for="task-date">Fecha de entrega</label>
                    <input id="task-date" type="date" required>
                </div>
                <div class="field-group field-full">
                    <label for="task-description">Descripción</label>
                    <textarea id="task-description" rows="4" placeholder="Descripción breve"></textarea>
                </div>
                <button class="button button-primary button-agregar-tarea" type="submit">Agregar tarea</button>
            </form>
        </section>

         <section>
            <h2>Enlaces rápidos</h2>
            <div class="button-row">
                <a class="button button-primary button-eventos-tareas" href="tareas.html">Tareas</a>
                <a class="button button-primary button-eventos-calificaciones" href="calificaciones.html">Calificaciones</a>
                <a class="button button-primary button-eventos-contacto" href="contacto.html">Contacto</a>
            </div>
        </section>

        </div>
    </main>

    <footer>
        <p>Contacto: info@laesquinita.cr</p>
        <p>© 2026 La Esquinita</p>
    </footer>
</body>
</html>
